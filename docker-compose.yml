services:
  subgen:
    container_name: subgen
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.home.arpa:5000/ngallodev/subgen:local
    gpus: all
    tty: true
    restart: unless-stopped
    environment:
      DEBUG: "True"
      LRC_FOR_AUDIO_FILES: "True"
      WHISPER_MODEL: large-v3
      COMPUTE_TYPE: "float16"
      WHISPER_THREADS: "4"
      CLEAR_VRAM_ON_COMPLETE: "True"
      APPEND: "False"
      CUSTOM_REGROUP: cm_sl=84_sl=42++++++1
      CUSTOM_MODEL_PROMPT: ""
      SUBGEN_KWARGS: >-
        {'temperature': 0.0, 'no_speech_threshold': 0.95, 'log_prob_threshold': -2.0, 'compression_ratio_threshold': 3.5, 'initial_prompt': 'Transcribe all audible human vocalizations, including speech, choking, sucking, sighs, groans, and nonverbal utterances'}
      WORD_LEVEL_HIGHLIGHT: "True"
      CONCURRENT_TRANSCRIPTIONS: "1"
      TRANSCRIBE_OR_TRANSLATE: transcribe
      USE_PATH_MAPPING: "False"
      PROCMEDIAONPLAY: "False"
      MODEL_PATH: /subgen/models
      TRANSCRIBE_FOLDERS: /movies
      PROCADDEDMEDIA: "True"
      TRANSCRIBE_DEVICE: cuda
      SKIPIFINTERNALSUBLANG: eng
      UPDATE: "False"
      USE_MODEL_PROMPT: "False"
      MONITOR: "True"
      NAMESUBLANG: aa
      STARTUP_SCAN_DB_PATH: "/subgen/state/subgen_scan.db"
      STARTUP_SCAN_BENCHMARK_LOGGING: "True"
      STARTUP_SCAN_BENCHMARK_LOG_PATH: "/subgen/state/startup_scan_benchmarks.jsonl"
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      MPLCONFIGDIR: /cache/matplotlib
      PYTHONUNBUFFERED: "1"
    volumes:
        - subgen_network_drive:/movies:rw
        - ./models:/subgen/models:rw
        - "${APPDATA:-./.appdata}/subgen/state:/subgen/state"
    ports:
         - "9000:9000"

volumes:
  subgen_network_drive:
    external: true
    name: subgen_network_drive
